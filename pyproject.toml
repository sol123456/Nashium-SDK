[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nashium-sdk"
version = "0.1.0"
description = "Nashium Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nashium"}]

[project.scripts]
nashium = "nashium.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

dependencies = [
    # ... existing deps ...
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.scripts]
nashium-worker = "nashium_sdk.worker.__main__:main"